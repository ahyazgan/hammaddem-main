<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 40" fill="currentColor">
  <!-- Ana tank gövdesi - yatay silindir -->
  <rect x="4" y="4" width="52" height="20" rx="10" ry="10"/>
  <!-- Tank üst parlama -->
  <rect x="10" y="6" width="40" height="4" rx="2" fill="white" opacity="0.18"/>
  <!-- Tank alt gölge -->
  <rect x="8" y="20" width="44" height="2" rx="1" opacity="0.15" fill="white"/>
  <!-- Arka konik huniler (boşaltma) -->
  <path d="M14 24 L18 30 L10 30 Z" opacity="0.75"/>
  <path d="M32 24 L36 30 L28 30 Z" opacity="0.75"/>
  <path d="M50 24 L54 30 L46 30 Z" opacity="0.75"/>
  <!-- Şasi çizgisi -->
  <rect x="6" y="30" width="52" height="2" rx="1"/>
  <!-- Ön dayanak / kingpin -->
  <rect x="6" y="28" width="3" height="4" rx="1" opacity="0.6"/>
  <!-- Arka tekerlekler (tandem aks) -->
  <circle cx="44" cy="36" r="3.5"/>
  <circle cx="44" cy="36" r="1.5" fill="white" opacity="0.2"/>
  <circle cx="53" cy="36" r="3.5"/>
  <circle cx="53" cy="36" r="1.5" fill="white" opacity="0.2"/>
  <!-- Üst dolum kapakları -->
  <rect x="16" y="2" width="4" height="3" rx="1.5" opacity="0.5"/>
  <rect x="30" y="2" width="4" height="3" rx="1.5" opacity="0.5"/>
  <rect x="44" y="2" width="4" height="3" rx="1.5" opacity="0.5"/>
</svg>