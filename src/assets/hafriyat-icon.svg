<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 40" fill="currentColor">
  <!-- Damper kasa gövdesi - trapez şekil -->
  <path d="M8 8 L56 8 L52 24 L4 24 Z" opacity="0.9"/>
  <!-- Kasa üst kenar -->
  <rect x="7" y="6" width="50" height="3" rx="1.5"/>
  <!-- Kasa iç gölge -->
  <path d="M10 10 L54 10 L51 22 L6 22 Z" fill="white" opacity="0.1"/>
  <!-- Kasa dikey nervürler -->
  <rect x="18" y="8" width="1.5" height="16" opacity="0.15" fill="white"/>
  <rect x="31" y="8" width="1.5" height="16" opacity="0.15" fill="white"/>
  <rect x="44" y="8" width="1.5" height="16" opacity="0.15" fill="white"/>
  <!-- Şasi çizgisi -->
  <rect x="2" y="24" width="56" height="2.5" rx="1.25"/>
  <!-- Ön dayanak / kingpin -->
  <rect x="4" y="22" width="3" height="5" rx="1" opacity="0.6"/>
  <!-- Arka tekerlekler (tandem aks) -->
  <circle cx="42" cy="31" r="3.8"/>
  <circle cx="42" cy="31" r="1.6" fill="white" opacity="0.2"/>
  <circle cx="52" cy="31" r="3.8"/>
  <circle cx="52" cy="31" r="1.6" fill="white" opacity="0.2"/>
  <!-- Hidrolik piston (damper kaldırma) -->
  <rect x="48" y="10" width="2" height="14" rx="1" opacity="0.4"/>
  <rect x="47" y="9" width="4" height="2.5" rx="1" opacity="0.5"/>
</svg>